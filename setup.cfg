[metadata]
name = sosid
description = System of Systems Inverse Design Toolkit
long_description = file: README.md, CHANGELOG.md
long_description_content_type = text/markdown
keywords =
    system of systems
    sos
    inverse design
    agent based modelling
    cellular automata
license = Mozilla Public License Version 2.0
license-file = LICENSE.md
url = https://github.com/pandaworksSOS/sosid_toolkit
author = San Kilkis
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: Mozilla Public License Version 2.0
    Operating System :: OS Independent
    Programming Language :: Python :: 3.10
    Topic :: Software Development :: Build Tools

[options]
zip_safe = False
packages = find:
# 3.11+ is not supported yet
python_requires = >= 3.10
package_dir =
    = src
install_requires =
    numpy < 2.0
    numba
    pandas
    matplotlib
    PyQt5 >= 5.14
    pydantic
    pyqtgraph >= 0.11.0rc0
    pyyaml
    qdarkstyle
    haversine
    pillow
    mesa <=1.0.0
    Deprecated
    pyproj >= 3.5.0
    qtawesome
    scipy < 1.14
    orjson
    recordclass <= 0.22.1
    pyinstrument
    colorama
    shapely
    scikit-image <= 0.22.0
    attrs >= 24.1.0
    msgpack
    pyarrow
    h5py
    tables
    geopandas

setup_requires =
    setuptools_scm
    setuptools >= 40
tests_require =
    pytest >= 6.2.4
    pytest-cov
    pytest-mock
dependency_links =
    git+https://github.com/pyqtgraph/pyqtgraph@develop#egg=pyqtgraph

[options.package_data]
sosid =
    static/icons/*.svg
    gui/templates/*.ui

[options.packages.find]
where = src

# TODO consolidate repeated packages in [dev, cicd] into a new extra
[options.extras_require]
cuda =
    cudatoolkit
    cupy
dev =
    pytest
    pytest-cov
    pytest-mock
    jupyter # Needed for running interactively with VS Code
    pre-commit
    ruff >= 0.8
    gitpython
    unidiff
docs =
    sphinx <= 7.0.1 # Temporarily limit until #386 resolved
    sphobjinv
    sphinx-autodoc-typehints
    sphinxcontrib-bibtex
    sphinxcontrib-plantuml
    sphinx_bootstrap_theme
cicd =
    pytest
    pytest-cov
    pytest-mock
    ruff
    gitpython
    unidiff
geo =
    rasterio
    contextily
    overpy
    osmnx > 2.0
graph_viz =
    folium
    mapclassify
post_scripts =  # Dependencies for postprocessing scripts
    cartopy

# [options.package_data]
# pre_commit.resources =
#     *.tar.gz
#     empty_template_*
#     hook-tmpl

# [doc8]
# Style-guide enforcement for .rst files
# file-encoding =

[tool:pytest]
# Runs coverage.py through use of the pytest-cov plugin
# An xml report is generated and results are output to the terminal
addopts =
    --cov
    --cov-report xml:coverage.xml
    --cov-report term
filterwarnings =
    ignore::DeprecationWarning:jinja2.*:
markers =
    sphinx
# Sets the minimum allowed pytest version
minversion = 5.0
# Sets the path where test files are located (Speeds up Test Discovery)
testpaths = tests

[coverage:run]
# Due to a strange bug with xml output of coverage.py not writing the full-path
# of the sources, the full root directory is presented as a source alongside
# the main package. As a result any importable Python file/package needs to be
# included in the omit
source =
    src/
    util
    docs/
# Excludes the following directories from the coverage report
# .env = Default name of the virtual environment from CONTRIBUTING.md

# TODO Consider extending pre-commit hooks
