name: build

on:
    pull_request:
        branches:
            - master
            - develop
        types:
            - opened
            - reopened
            - synchronize

jobs:
    build:
        name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        continue-on-error: ${{ matrix.optional }}
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12"]
                os: [windows-latest]
                optional: [true]
                include:
                    - python-version: "3.10"
                      optional: false
                      os: windows-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Upgrade pip and Get Cache Directory
              id: pip_cache
              shell: bash
              run: |
                  python -m pip install --upgrade pip
                  dir=$(pip cache dir)
                  echo $dir
                  echo ::set-output name=dir::$dir
            - name: Restoring Downloaded Packages
              uses: actions/cache@v4
              id: cache
              with:
                  path: ${{ steps.pip_cache.outputs.dir }}
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/setup.cfg') }}-${{ matrix.python-version }}
            - name: Installing Package and Dependencies
              shell: bash
              run: .github/scripts/install.sh
            - name: Linting/Style Checking with Flake8 (Black, isort, docstrings)
              # FIXME: Currently flake8 does not raise any errors due to --exit-zero
              run: |
                  pip install flake8
                  flake8 . --count --statistics --exit-zero
            - name: Unit Testing with Pytest
              run: |
                  pip install pytest
                  pytest --runslow
            - name: Checking Code Coverage
              run: |
                  coverage report --fail-under=30
